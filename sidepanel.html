<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Imp Stuff</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      font-size: 18px;
      padding: 10px;
    }

    button {
      padding: 6px 10px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    h4 {
      margin: 12px 0 6px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 3px;
    }

    .detail {
      padding: 6px;
      background: #f5f5f5;
      margin-bottom: 6px;
      cursor: pointer;
      border-radius: 3px;
      word-break: break-word;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .label {
      font-size: 12px;
      color: #555;
      margin-right: 4px;
    }

    .no-data {
      color: #777;
      font-style: italic;
    }

    .provider-icon {
      font-size: 18px;
    }

    .provider-high {
      color: green;
    }

    .provider-medium {
      color: orange;
    }
  </style>
</head>

<body>

  <button id="refresh-data">Refresh Data</button>
  <a href="/ulrtransformer.html"><button id="url-tool">Transform URL Tool</button></a>

  <h4>Page URL:</h4>
  <div id="url-info"></div>

  <h4>Website Provider:</h4>
  <div id="provider-info"></div>

  <h4>Meta Info:</h4>
  <div id="meta-info"></div>
  
  <h4>Address:</h4>
  <div id="address-info"></div>

  <h4>Location:</h4>
  <div id="geo-info"></div>

  <h4>Social Links:</h4>
  <div id="social-info"></div>

  <h4>GA/GTM:</h4>
  <div id="analytics-info"></div>

  <script src="sidepanel.js"></script>

</body>
</html>
