<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Dealer Tools</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      font-size: 14px;
      padding: 10px;
    }
    button {
      padding: 6px 10px;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .detail {
      padding: 5px;
      background: #f5f5f5;
      margin-bottom: 5px;
      cursor: pointer;
    }
    .no-data {
      color: #777;
      font-style: italic;
    }
  </style>
</head>
<body>

  <h3>Dealer Information</h3>
  <button id="refresh-data">Refresh Data</button>
  <div id="status-message" class="no-data"></div>
  <div id="dealer-details"></div>

  <h3>Analytics</h3>
  <div id="analytics-details"></div>

  <script src="sidepanel.js"></script>
</body>
</html>
